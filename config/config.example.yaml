# Ski Forecast Generator configuration
# Copy to config/config.yaml and edit.  Validate with:
#   docker compose run --rm skiforecast check-config
#
# ${VAR} / ${VAR:-default} are replaced with environment variables (see .env).

general:
  timezone: America/Vancouver       # axis labels, daily-total boundaries, local times shown next to Z times
  poll_interval_minutes: 5          # how often to look for new model runs
  data_dir: /data                   # mounted volume (state, extracted runs, PNGs)
  download_workers: 6               # parallel downloads/decodes
  profile_top_hpa: 600              # download pressure levels from the surface up to this level (~4.2 km)
  keep_runs: 3                      # processed runs kept per model
  keep_charts: 20                   # rendered PNGs kept per chart
  post_on_startup: true             # post every chart on first start even if nothing changed

discord:
  enabled: true
  default_webhook: ${DISCORD_WEBHOOK_DEFAULT}   # used by charts without their own webhook
  alerts_webhook: ${DISCORD_WEBHOOK_ALERTS:-}   # errors, stale models, start-up notice (optional)
  username: Ski Forecast
  startup_message: true
  alert_repeat_hours: 6

# Named locations.  Each chart source picks a point and can shift it by whole
# grid cells with `offset: [east, north]`, e.g. [-1, -1] = one cell left, one down
# (same idea as moving tiles on SpotWX).  Run `check-config`, then look at the
# chart footer: it prints the grid cell's coordinates and the model's ground
# elevation so you can pick the cell whose elevation suits you.
points:
  whistler_peak:
    label: Whistler Peak
    lat: 50.0592
    lon: -122.9486
    elevation_m: 2182
  whistler_village:
    label: Whistler Village
    lat: 50.1163
    lon: -122.9574
    elevation_m: 675

# Built-in models: hrdps, hrdps_west, rdps, gdps.  Override any field here, e.g.
#   models:
#     hrdps:
#       profile_step_hours: 1     # hourly upper-air data (default 3; ~3x the download)
#     gdps:
#       enabled: true
# A completely new Datamart model can be added by giving every field
# (see skiforecast/models.py for the format).
models: {}

charts:
  # ---------------------------------------------------------------- 2-day, low elevation
  - id: low_2day
    title: "Whistler Village — 2-day ({fl_models})"
    subtitle: "Freezing Level · Precipitation"
    hours: 48
    # Sources are used in order; if HRDPS-West has no data yet, HRDPS fills in.
    freezing_level:
      - { model: hrdps_west, point: whistler_village }
      - { model: hrdps, point: whistler_village }
    # precipitation: omitted -> same sources as freezing_level
    precip_bar_hours: 3
    precip_total_hours: 24
    reference_lines:
      - { elevation: 675, label: Village }
      - { elevation: 1850, label: Roundhouse }
    style:
      elevation_max_m: 3500

  # ---------------------------------------------------------------- 2-day, high elevation
  - id: high_2day
    title: "Whistler Peak — 2-day ({fl_models})"
    hours: 48
    freezing_level:
      - { model: hrdps_west, point: whistler_peak }
      - { model: hrdps, point: whistler_peak }
    precip_bar_hours: 3
    wind:
      enabled: true
      elevation_m: 2200
      every_hours: 3
    reference_lines:
      - { elevation: 1850, label: Roundhouse }
      - { elevation: 2182, label: Peak }

  # ---------------------------------------------------------------- 10-day
  - id: long_term
    title: "Whistler — 10-day Meteogram ({fl_models})"
    subtitle: "Freezing Level · Precipitation"
    hours: 240
    trim_to_data: true               # end the chart where the model data ends (no empty space on the right)
    freezing_level:
      - { model: hrdps, point: whistler_peak, until_hour: 48 }
      - { model: gdps, point: whistler_peak, offset: [-1, -1] }
    precipitation:
      - { model: hrdps, point: whistler_peak, until_hour: 48 }
      - { model: gdps, point: whistler_peak, offset: [-1, -1] }
    # Example: GDPS freezing level for the whole chart instead:
    # freezing_level:
    #   - { model: gdps, point: whistler_peak, offset: [-1, -1] }
    freezing_level_method: highest   # highest | lowest 0 °C crossing
    below_ground: extrapolate        # extrapolate | clamp | hide  (freezing level under the model terrain)
    show_wetbulb_zero: true          # dashed snow-level estimate
    precip_bar_hours: 6
    precip_total_hours: 24
    # precip_total_start_hour_local: 5   # local hour the boxed totals start (default: style.tick_hour_utc,
                                         # else local midnight; snapped to the model output step, e.g. 3 h for GDPS)
    reference_lines:
      - { elevation: 1500, label: "" }
    # webhook: ${DISCORD_WEBHOOK_LONGTERM}   # per-chart webhook (optional)
    # message: "@here new 10-day"           # text posted with the image
    # min_post_interval_minutes: 60         # throttle posts
    style:
      elevation_max_m: 4000
      # precip_axis_max_mm: 20
      tick_hour_utc: 12        # UTC hour of the daily x-axis marker (default: local midnight); labels stay in local time
      # min_ticks_per_day: 4   # at least this many markers per day, 1-11 (1 = daily, 4 = every 6 h, 7-11 = every 2-3 h)
    # When to post.  Default: whenever any model the chart uses has a new run.
    # post:
    #   models: [hrdps]              # only new HRDPS runs trigger a post (GDPS is still used for the data)
    #   times: ["06:00", "17:00"]    # or: post on a local-time schedule instead of on model updates

  # ---------------------------------------------------------------- Blended Snow Forecast, 2-day
  # Stacked panels, one per elevation, with snow (cm) and rain (mm) per 3 h slot and a
  # spread (margin of error).  The spread comes from the model's recent runs, the grid
  # cells around the point and fixed perturbations of the snow physics; nothing is
  # trained, so it is a disagreement measure, not a calibrated confidence interval.
  - id: snow_2day
    type: blended_snow
    title: "Whistler — Blended Snow Forecast ({models})"
    hours: 48
    trim_to_data: true
    sources:                         # same chain idea as the meteogram: profile + precipitation per model
      - { model: hrdps, point: whistler_peak }
    elevations:                      # 1-5 entries, each gets a panel (numbers or {elevation, label})
      - { elevation: 2182, label: Peak }
      - { elevation: 1850, label: Roundhouse }
      - { elevation: 675, label: Village }
    bar_hours: 3
    total_hours: 24
    # blend:                         # defaults shown; usually nothing to change
    #   lagged_runs: 3               # recent runs of each model to blend (needs general.keep_runs >= this)
    #   neighbourhood_km: 6          # radius of grid cells around the point (0 = centre cell only)
    #   temperature_sigma_c: 1.0     # +/- wet-bulb perturbation for the rain/snow decision
    #   ratio_spread: 0.3            # +/- fraction on the snow-to-liquid ratio
    #   widen: 1.5                   # ensembles are under-dispersive; the raw spread is multiplied by this
    #   use_wind: false              # lower the ratio in strong wind (downloads the wind files too)
    #   snow_level_offset_m: 150     # snow reaches this far below the wet-bulb 0 °C height (more in heavy precip)
    post:
      models: [hrdps]                # one post per new HRDPS run
    style:
      tick_hour_utc: 12
      min_ticks_per_day: 2
      # show_bar_ranges: true        # also print "low–high" under each bar value
      # show_slot_separators: false # drop the thin lines between slots (default: on)
